	access_log /var/log/nginx/access_mempool.log;
	error_log /var/log/nginx/error_mempool.log;

	root /var/www/mempool/browser;

	index index.html;

	# enable browser and proxy caching
	add_header Cache-Control "public, no-transform";

	# vary cache if user changes language preference
	add_header Vary Accept-Language;
	add_header Vary Cookie;

	# Proxy del precio de Bitcoin-Blake2b (BTCB2/USDC) desde neoxa.exchange.
	# neoxa no manda CORS, así que lo servimos same-origin. Cache corta para no
	# machacar su API (Cloudflare y el navegador lo cachean 30s).
	location = /neoxa-ticker {
		resolver 1.1.1.1 8.8.8.8 valid=300s;
		proxy_pass https://neoxa.exchange/api/exchange/ticker/BTCB2_USDC;
		proxy_ssl_server_name on;
		proxy_set_header Host neoxa.exchange;
		proxy_set_header Referer https://neoxa.exchange/;
		proxy_hide_header Access-Control-Allow-Origin;
		add_header Access-Control-Allow-Origin "*" always;
		add_header Cache-Control "public, max-age=30" always;
		expires 30s;
	}
	# Precio BTCB2/BTC (mismo, par contra BTC)
	location = /neoxa-ticker-btc {
		resolver 1.1.1.1 8.8.8.8 valid=300s;
		proxy_pass https://neoxa.exchange/api/exchange/ticker/BTCB2_BTC;
		proxy_ssl_server_name on;
		proxy_set_header Host neoxa.exchange;
		proxy_set_header Referer https://neoxa.exchange/;
		proxy_hide_header Access-Control-Allow-Origin;
		add_header Access-Control-Allow-Origin "*" always;
		add_header Cache-Control "public, max-age=30" always;
		expires 30s;
	}

	# Alquiler más barato de 1 TH/s en MiningRigRentals (algo blake2b), en BTC real.
	location = /mrr-cheapest {
		resolver 1.1.1.1 8.8.8.8 valid=300s;
		proxy_pass https://www.miningrigrentals.com/api/v2/rig?type=blake2b&orderby=price&order=asc&count=1;
		proxy_ssl_server_name on;
		proxy_set_header Host www.miningrigrentals.com;
		proxy_hide_header Access-Control-Allow-Origin;
		add_header Access-Control-Allow-Origin "*" always;
		add_header Cache-Control "public, max-age=120" always;
		expires 120s;
	}
	# Precio BTC real (para convertir el coste de alquiler de MRR a $).
	location = /btc-usd {
		resolver 1.1.1.1 8.8.8.8 valid=300s;
		proxy_pass https://api.kraken.com/0/public/Ticker?pair=XBTUSD;
		proxy_ssl_server_name on;
		proxy_set_header Host api.kraken.com;
		proxy_hide_header Access-Control-Allow-Origin;
		add_header Access-Control-Allow-Origin "*" always;
		add_header Cache-Control "public, max-age=120" always;
		expires 120s;
	}

	# fallback for all URLs i.e. /address/foo /tx/foo /block/000
	location / {
		try_files /$lang/$uri /$lang/$uri/ $uri $uri/ /en-US/$uri @index-redirect;
		expires 10m;
	}
	location /resources {
		try_files $uri @index-redirect;
		expires 1h;
	}

	# only cache /resources/config.* for 5 minutes since it changes often
	location /resources/config. {
		try_files $uri =404;
		expires 5m;
	}
	# only cache /resources/customize.* for 5 minutes since it changes often
	location /resources/customize. {
		try_files $uri =404;
		expires 5m;
	}

	location @index-redirect {
		rewrite (.*) /$lang/index.html;
	}

	# location block using regex are matched in order

	# used for cookie override
	location ~ ^/(ar|bg|bs|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi)/ {
		try_files $uri $uri/ /$1/index.html =404;
	}

	# static API docs
	location = /api {
		try_files $uri $uri/ /en-US/index.html =404;
	}
	location = /api/ {
		try_files $uri $uri/ /en-US/index.html =404;
	}

	# Widget de Android: límite por IP + caché de 60 s en nginx. Con la caché, aunque lo
	# usen miles de móviles, al backend le llega como mucho una petición por minuto.
	# (Dos location exactas y no una regex: nginx no admite proxy_pass con ruta dentro de
	# una location con regex, y eso tumbó la web el 1 oct 2026.)
	location = /api/v1/blake2b/widget {
		limit_req zone=widget burst=20 nodelay;
		proxy_pass http://__MEMPOOL_BACKEND_MAINNET_HTTP_HOST__:__MEMPOOL_BACKEND_MAINNET_HTTP_PORT__/api/v1/blake2b/widget;
		proxy_cache cache;
		proxy_cache_valid 200 60s;
		proxy_cache_lock on;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		add_header X-Cache $upstream_cache_status always;
	}
	location = /api/blake2b/widget {
		limit_req zone=widget burst=20 nodelay;
		proxy_pass http://__MEMPOOL_BACKEND_MAINNET_HTTP_HOST__:__MEMPOOL_BACKEND_MAINNET_HTTP_PORT__/api/v1/blake2b/widget;
		proxy_cache cache;
		proxy_cache_valid 200 60s;
		proxy_cache_lock on;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		add_header X-Cache $upstream_cache_status always;
	}
	location /api/v1/ws {
		proxy_pass http://__MEMPOOL_BACKEND_MAINNET_HTTP_HOST__:__MEMPOOL_BACKEND_MAINNET_HTTP_PORT__/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
	location /api/v1/services {
		proxy_pass https://mempool.space;
	}
	location /api/v1 {
		proxy_pass http://__MEMPOOL_BACKEND_MAINNET_HTTP_HOST__:__MEMPOOL_BACKEND_MAINNET_HTTP_PORT__/api/v1;
	}
	location /api/ {
		proxy_pass http://__MEMPOOL_BACKEND_MAINNET_HTTP_HOST__:__MEMPOOL_BACKEND_MAINNET_HTTP_PORT__/api/v1/;
	}

	# mainnet API
	location /ws {
		proxy_pass http://__MEMPOOL_BACKEND_MAINNET_HTTP_HOST__:__MEMPOOL_BACKEND_MAINNET_HTTP_PORT__/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
