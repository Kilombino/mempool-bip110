<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitcoin Nodes World Map</title>
<link rel="icon" href="/resources/favicons/favicon-32x32.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#11131f; --panel:#1d1f31; --line:#2d3348; --text:#e6e6f0; --muted:#8a8fa8; --accent:#7f5af0; --ok:#3bcc49; --peer:#ffb74d; --seen:#6c7293; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#1d1f31; border-bottom:1px solid var(--line); }
  header a { color:var(--text); text-decoration:none; font-weight:600; }
  header .back { margin-left:auto; color:var(--muted); font-weight:400; font-size:13px; }
  main { max-width:1300px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:4px 0 12px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--muted); font-size:12px; }
  #map { height:520px; border-radius:8px; border:1px solid var(--line); background:#0b0d17; }
  .legend { color:var(--muted); font-size:12px; margin:8px 0 18px; display:flex; gap:16px; flex-wrap:wrap; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .controls input, .controls select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .controls input { flex:1; min-width:180px; }
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { background:var(--panel); color:var(--muted); font-weight:500; cursor:pointer; position:sticky; top:0; }
  td.addr { font-family:ui-monospace,Menlo,monospace; font-size:12px; max-width:340px; overflow:hidden; text-overflow:ellipsis; }
  .muted { color:var(--muted); }
  .note { color:var(--muted); font-size:12px; margin-top:12px; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--panel); color:var(--text); }
  .leaflet-popup-content { font-size:12px; max-height:240px; overflow:auto; }
  .leaflet-container a { color:#b39dff; }
  .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.4); }
  .leaflet-control-attribution { background:rgba(17,19,31,.8)!important; color:var(--muted); }
  /* Embedded in the mempool dashboard: only the summary line and the map. */
  body.embed { background:transparent; }
  body.embed header, body.embed h1, body.embed .stats, body.embed .controls, body.embed .tablewrap, body.embed .legend { display:none; }
  body.embed main { max-width:none; padding:0; }
  body.embed #map { height:calc(100vh - 34px); border:none; border-radius:6px; background:transparent; }
  .summary { display:none; color:var(--muted); font-size:13px; margin:0 0 8px; gap:14px; flex-wrap:wrap; align-items:center; }
  .summary b { color:var(--text); }
  body.embed .summary { display:flex; }
  body.embed .note { display:none; }
</style>
</head>
<body>
<header><a href="/" id="home">Explorer</a><a class="back" href="/">← Back to the explorer</a></header>
<main>
  <h1>Bitcoin Nodes World Map</h1>
  <div class="stats" id="stats"></div>
  <div class="summary" id="summary"></div>
  <div id="map"></div>
  <div class="legend">
    <span><span class="dot" style="background:var(--ok)"></span>Reachable (answered our last probe)</span>
    <span><span class="dot" style="background:var(--peer)"></span>Connected to our node, not listening</span>
    <span><span class="dot" style="background:var(--seen)"></span>Seen in the last 30 days</span>
  </div>
  <div class="controls">
    <input id="q" placeholder="Filter by address, version, country, city…">
    <select id="net"><option value="">All networks</option><option>ipv4</option><option>ipv6</option><option>onion</option></select>
    <select id="st"><option value="">Any status</option><option value="reachable">Reachable</option><option value="peer">Connected peer</option><option value="seen">Seen</option></select>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th data-k="address">Address</th><th data-k="ua">Version</th><th data-k="height">Height</th><th data-k="network">Network</th><th data-k="place">Location</th><th data-k="status">Status</th><th data-k="last_seen">Last seen</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <p class="note" id="note"></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COLORS = { reachable:'#3bcc49', peer:'#ffb74d', seen:'#6c7293' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ago = (t) => { const s = Date.now()/1000 - t; if (s < 3600) return Math.max(1, Math.round(s/60)) + ' min ago'; if (s < 86400) return Math.round(s/3600) + ' h ago'; return Math.round(s/86400) + ' d ago'; };
const addr = (n) => n.port ? (n.network === 'ipv6' ? `[${n.address}]:${n.port}` : `${n.address}:${n.port}`) : n.address;
const place = (n) => n.geo ? [n.geo.city, n.geo.country].filter(Boolean).join(', ') : (n.network === 'onion' ? 'Tor' : '—');

// The explorer's own hostname, whatever it is served under (mempool.kilombino.com, a StartOS or Umbrel box...).
document.getElementById('home').textContent = location.host || 'Explorer';
const EMBED = /\/embed\/?$/.test(location.pathname);
if (EMBED) { document.body.classList.add('embed'); const b = document.createElement('base'); b.target = '_blank'; document.head.appendChild(b); }
// One world only: no wrapping, and the map cannot be dragged past its edges
// (going from Kamchatka on to America found no more nodes and was confusing).
const WORLD = L.latLngBounds([[-58, -180], [80, 180]]);
// The wheel zooms while the pointer is over the map; outside it the page scrolls as usual.
// Whole zoom levels only: fractional ones leave hairline seams between the tiles.
const map = L.map('map', { zoomSnap:1, wheelPxPerZoomLevel:120, maxBounds:WORLD, maxBoundsViscosity:1, worldCopyJump:false });
// At the minimum zoom the whole world fits (no zooming out past it); it opens one step closer.
const fitWorld = () => { const z = Math.max(1, Math.floor(map.getBoundsZoom(WORLD, false))); map.setMinZoom(z); return z; };
map.setView([38, 0], fitWorld() + 1);
window.addEventListener('resize', () => { const z = fitWorld(); if (map.getZoom() < z) map.setZoom(z); });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · IP geolocation by <a href="https://db-ip.com">DB-IP</a>', maxZoom:12, noWrap:true, bounds:WORLD,
}).addTo(map);

let nodes = [], sortK = 'status', sortDir = 1;
const rank = { reachable:0, peer:1, seen:2 };

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const net = document.getElementById('net').value, st = document.getElementById('st').value;
  const list = nodes.filter((n) => (!net || n.network === net) && (!st || n.status === st) &&
    (!q || [addr(n), n.ua, place(n)].join(' ').toLowerCase().includes(q)));
  const key = (n) => sortK === 'status' ? rank[n.status] : sortK === 'place' ? place(n) : sortK === 'address' ? addr(n) : n[sortK];
  list.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  document.getElementById('rows').innerHTML = list.map((n) => `<tr>
    <td class="addr" title="${esc(addr(n))}">${esc(addr(n))}</td><td>${esc(n.ua)}</td><td>${n.height ?? ''}</td>
    <td>${esc(n.network)}</td><td>${esc(place(n))}</td>
    <td><span class="dot" style="background:${COLORS[n.status]}"></span>${n.status}</td><td class="muted">${ago(n.last_seen)}</td></tr>`).join('');
}

document.querySelectorAll('th').forEach((th) => th.onclick = () => { const k = th.dataset.k; sortDir = sortK === k ? -sortDir : 1; sortK = k; render(); });
['q','net','st'].forEach((id) => document.getElementById(id).oninput = render);

fetch('nodes.json', { cache:'no-store' }).then((r) => r.json()).then(({ stats, nodes: ns }) => {
  nodes = ns;
  const s = [
    [stats.blake2b, 'nodes discovered by my node'],
    [stats.reachable, 'reachable now'],
    [stats.by_network.ipv4 || 0, 'IPv4'],
    [stats.by_network.ipv6 || 0, 'IPv6'],
    [stats.by_network.onion || 0, 'Tor'],
    [stats.tip.toLocaleString('en'), 'our tip'],
  ];
  document.getElementById('stats').innerHTML = s.map(([b, t]) => `<div class="stat"><b>${b}</b><span>${t}</span></div>`).join('');
  const nogeo = ns.filter((n) => !n.geo).length;
  document.getElementById('summary').innerHTML = `<span>Nodes discovered by my node: <b>${stats.blake2b}</b></span>` +
    `<span><span class="dot" style="background:${COLORS.reachable}"></span>Reachable: <b>${stats.reachable}</b></span>` +
    `<span>IPv4 <b>${stats.by_network.ipv4 || 0}</b> · IPv6 <b>${stats.by_network.ipv6 || 0}</b> · Tor <b>${stats.by_network.onion || 0}</b> (Tor nodes have no location)</span>` +
    `<span>Updated ${ago(stats.updated)}</span>`;
  document.getElementById('note').textContent = `Updated ${new Date(stats.updated*1000).toUTCString()}. Every hour our node probes the addresses it knows that announce the BLAKE2B service bit (${stats.probed} this time) with a version handshake; nodes are listed while their height is on this chain. Locations are approximate (city level).`;

  const groups = new Map();
  for (const n of ns) if (n.geo) { const k = n.geo.lat + ',' + n.geo.lon; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(n); }
  for (const g of groups.values()) {
    g.sort((a, b) => rank[a.status] - rank[b.status]);
    const best = g[0].status;
    L.circleMarker([g[0].geo.lat, g[0].geo.lon], { radius: (EMBED ? 3.5 : 5) + Math.min(EMBED ? 6 : 10, Math.sqrt(g.length) * (EMBED ? 1.4 : 2.2)), color: COLORS[best], fillColor: COLORS[best], fillOpacity: 0.55, weight: 1 })
      .bindPopup(`<b>${esc(place(g[0]))}</b> — ${g.length} node${g.length > 1 ? 's' : ''}<br>` +
        g.map((n) => `<span class="dot" style="background:${COLORS[n.status]}"></span>${esc(addr(n))}<br><span class="muted">${esc(n.ua)} · ${n.height}</span>`).join('<br>'))
      .addTo(map);
  }
  render();
}).catch(() => { document.getElementById('note').textContent = 'Could not load the node list.'; });
</script>
</body>
</html>
